<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Casa & Mercado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="pb-24">

    <!-- Header / Resumo do Mês -->
    <header class="p-5 pt-8 bg-gradient-to-b from-slate-900 to-slate-900/60 sticky top-0 z-50 border-b border-slate-800">
        <div class="flex justify-between items-center mb-4">
            <div>
                <p class="text-xs text-slate-400 uppercase tracking-wider font-medium">Painel Residencial</p>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-emerald-400"></i> Despensa & Mercado
                </h1>
            </div>
            <button onclick="abrirModal()" class="bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-slate-950 font-bold px-4 py-2.5 rounded-xl shadow-lg shadow-emerald-500/20 transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-plus"></i> Novo Item
            </button>
        </div>

        <!-- Card de Gasto Mensal -->
        <div class="glass-card rounded-2xl p-4 flex items-center justify-between shadow-xl">
            <div>
                <span class="text-xs text-slate-400">Total Gasto Este Mês</span>
                <h2 id="total-mes" class="text-2xl font-extrabold text-emerald-400 mt-0.5">R$ 0,00</h2>
            </div>
            <div class="w-11 h-11 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-lg">
                <i class="fa-solid fa-wallet"></i>
            </div>
        </div>
    </header>

    <!-- Lista de Itens -->
    <main class="p-4 max-w-xl mx-auto">
        <div class="flex justify-between items-center mb-3">
            <h3 class="text-sm font-semibold text-slate-400 tracking-wide uppercase">Itens Registrados</h3>
            <span id="contador-itens" class="text-xs text-slate-500">0 itens</span>
        </div>

        <div id="lista-container" class="space-y-3">
            <!-- Os itens entram dinamicamente via JS -->
            <div class="text-center py-12 text-slate-500">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                <p class="text-sm">Carregando dados...</p>
            </div>
        </div>
    </main>

    <!-- Modal de Cadastro / Adição -->
    <div id="modal-produto" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="glass-card w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 border-slate-700 shadow-2xl animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center mb-5">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-emerald-400"></i> Adicionar ao Estoque/Mercado
                </h3>
                <button onclick="fecharModal()" class="text-slate-400 hover:text-white p-2 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="form-produto" onsubmit="salvarItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Arroz 5kg, Detergente..." class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Categoria</label>
                        <select id="categoria" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                            <option value="Alimentação">Alimentação</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Higiene">Higiene</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Quantidade</label>
                        <input type="number" step="any" id="quantidade" value="1" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Preço Unitário (R$)</label>
                    <input type="number" step="0.01" id="preco_unitario" placeholder="0.00" required class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 text-sm">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition active:scale-95 text-sm mt-2">
                    Salvar Produto
                </button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '/api/itens';

        async function carregarDados() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                
                document.getElementById('total-mes').innerText = `R$ ${Number(data.totalMes).toFixed(2).replace('.', ',')}`;
                document.getElementById('contador-itens').innerText = `${data.itens.length} itens`;

                const container = document.getElementById('lista-container');
                if (data.itens.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-16 text-slate-500 glass-card rounded-2xl">
                            <i class="fa-solid fa-box-open text-3xl mb-2 opacity-50"></i>
                            <p class="text-sm">Nenhum produto cadastrado ainda.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = data.itens.map(item => `
                    <div class="glass-card rounded-2xl p-4 flex items-center justify-between border border-slate-800 hover:border-slate-700 transition">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-emerald-400">
                                <i class="fa-solid ${getIconeCategoria(item.categoria)} text-sm"></i>
                            </div>
                            <div>
                                <h4 class="font-semibold text-white text-sm">${item.nome}</h4>
                                <p class="text-xs text-slate-400">${item.quantidade}x • R$ ${Number(item.preco_unitario).toFixed(2).replace('.', ',')} un</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <span class="text-sm font-bold text-emerald-400">R$ ${Number(item.valor_total).toFixed(2).replace('.', ',')}</span>
                                <p class="text-[10px] text-slate-500">${new Date(item.data_compra).toLocaleDateString('pt-BR')}</p>
                            </div>
                            <button onclick="deletarItem('${item.id}')" class="text-slate-500 hover:text-red-400 p-2 transition">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                console.error("Erro ao carregar:", err);
            }
        }

        function getIconeCategoria(cat) {
            if (cat === 'Alimentação') return 'fa-utensils';
            if (cat === 'Limpeza') return 'fa-pump-soap';
            if (cat === 'Higiene') return 'fa-shower';
            return 'fa-box';
        }

        function abrirModal() { document.getElementById('modal-produto').classList.remove('hidden'); }
        function fecharModal() { document.getElementById('modal-produto').classList.add('hidden'); }

        async function salvarItem(e) {
            e.preventDefault();
            const body = {
                nome: document.getElementById('nome').value,
                categoria: document.getElementById('categoria').value,
                quantidade: Number(document.getElementById('quantidade').value),
                preco_unitario: Number(document.getElementById('preco_unitario').value)
            };

            const res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });

            if (res.ok) {
                fecharModal();
                document.getElementById('form-produto').reset();
                carregarDados();
            }
        }

        async function deletarItem(id) {
            if (confirm('Deseja realmente remover este item?')) {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) carregarDados();
            }
        }

        carregarDados();
    </script>
</body>
</html>
