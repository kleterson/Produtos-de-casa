<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Mobile de Estoque e Mercado</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-20">

    <!-- Header / Topo -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-md">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Painel Residencial</p>
                <h1 class="text-xl font-bold flex items-center gap-2 text-white">
                    <i class="fa-solid fa-cart-shopping text-emerald-400"></i> Despensa & Mercado
                </h1>
            </div>
            <button onclick="abrirModalProduto()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-xl flex items-center gap-2 transition shadow-lg shadow-emerald-500/20 active:scale-95">
                <i class="fa-solid fa-plus"></i> Novo Item
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Card Resumo do Mês & Seletor -->
        <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-800 rounded-2xl p-5 shadow-xl relative overflow-hidden">
            <div class="flex justify-between items-start">
                <div>
                    <p id="label-mes-atual" class="text-xs font-medium text-slate-400 uppercase tracking-wide">Total Gasto Este Mês</p>
                    <h2 id="total-mes" class="text-3xl font-extrabold text-emerald-400 mt-1">R$ 0,00</h2>
                </div>
                <!-- Botão da Carteira para Filtrar Meses -->
                <button onclick="toggleFiltroMes()" class="bg-slate-800 hover:bg-slate-700 p-3 rounded-xl border border-slate-700 transition text-emerald-400 shadow-md active:scale-95" title="Selecionar Mês">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </button>
            </div>

            <!-- Caixa de Seleção de Mês (Oculta por padrão) -->
            <div id="painel-filtro-mes" class="hidden mt-4 pt-4 border-t border-slate-800/80 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-300">Escolha o Mês de Referência:</span>
                    <button onclick="limparFiltroMes()" class="text-xs text-emerald-400 hover:underline">Mês Atual</button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <select id="select-mes" class="bg-slate-950 border border-slate-700 rounded-xl p-2 text-sm text-slate-200 outline-none focus:border-emerald-500">
                        <option value="0">Janeiro</option>
                        <option value="1">Fevereiro</option>
                        <option value="2">Março</option>
                        <option value="3">Abril</option>
                        <option value="4">Maio</option>
                        <option value="5">Junho</option>
                        <option value="6">Julho</option>
                        <option value="7">Agosto</option>
                        <option value="8">Setembro</option>
                        <option value="9">Outubro</option>
                        <option value="10">Novembro</option>
                        <option value="11">Dezembro</option>
                    </select>
                    <select id="select-ano" class="bg-slate-950 border border-slate-700 rounded-xl p-2 text-sm text-slate-200 outline-none focus:border-emerald-500">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                        <option value="2028">2028</option>
                    </select>
                </div>
                <button onclick="aplicarFiltroMes()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold py-2 rounded-xl text-sm transition">
                    Filtrar Período
                </button>
            </div>
        </div>

        <!-- Lista de Itens -->
        <section class="space-y-3">
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 px-1">
                <span id="titulo-secao-itens">ITENS DO MÊS</span>
                <span id="contador-itens">0 itens</span>
            </div>
            
            <div id="lista-itens" class="space-y-2.5">
                <!-- Preenchido via JavaScript -->
            </div>
        </section>
    </main>

    <!-- Modal Adicionar Produto -->
    <div id="modal-produto" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 shadow-2xl space-y-4 animate-in fade-in slide-in-from-bottom duration-200">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-lg flex items-center gap-2 text-white">
                    <i class="fa-solid fa-basket-shopping text-emerald-400"></i> Adicionar ao Estoque/Mercado
                </h3>
                <button onclick="fecharModalProduto()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="form-produto" onsubmit="salvarProduto(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" required placeholder="Ex: Arroz 5kg" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Categoria</label>
                        <select id="categoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Alimentação">Alimentação</option>
                            <option value="Limpeza">Limpeza</option>
                            <option value="Higiene">Higiene</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Quantidade</label>
                        <input type="number" id="quantidade" value="1" min="1" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Preço Unitário (R$)</label>
                    <input type="number" step="0.01" id="preco_unitario" required placeholder="0.00" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-emerald-500">
                </div>

                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20 active:scale-95">
                    Salvar Produto
                </button>
            </form>
        </div>
    </div>

    <!-- Script de Gerenciamento -->
    <script>
        const nomesMeses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
        let mesSelecionado = new Date().getMonth();
        let anoSelecionado = new Date().getFullYear();

        document.getElementById('select-mes').value = mesSelecionado;
        document.getElementById('select-ano').value = anoSelecionado;

        function toggleFiltroMes() {
            const painel = document.getElementById('painel-filtro-mes');
            painel.classList.toggle('hidden');
        }

        async function carregarDados() {
            try {
                const response = await fetch(`/api/itens?mes=${mesSelecionado}&ano=${anoSelecionado}`);
                const resultado = await response.json();
                
                // Atualiza o card superior
                document.getElementById('total-mes').innerText = `R$ ${Number(resultado.totalMes).toFixed(2).replace('.', ',')}`;
                document.getElementById('label-mes-atual').innerText = `Total Gasto em ${nomesMeses[mesSelecionado]} de ${anoSelecionado}`;
                
                // Renderiza a lista
                const lista = document.getElementById('lista-itens');
                document.getElementById('contador-itens').innerText = `${resultado.itens.length} itens`;
                
                if (resultado.itens.length === 0) {
                    lista.innerHTML = `
                        <div class="text-center py-10 bg-slate-900/40 border border-slate-800/60 rounded-2xl">
                            <i class="fa-solid fa-box-open text-3xl text-slate-600 mb-2"></i>
                            <p class="text-sm text-slate-400">Nenhum item registrado em ${nomesMeses[mesSelecionado]}.</p>
                        </div>
                    `;
                    return;
                }

                lista.innerHTML = '';
                resultado.itens.forEach(item => {
                    const dataFormatada = new Date(item.data_compra).toLocaleDateString('pt-BR');
                    const valorTotalItem = Number(item.quantidade) * Number(item.preco_unitario);
                    
                    lista.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-4 flex justify-between items-center shadow-md">
                            <div class="flex items-center gap-3">
                                <div class="bg-slate-800 p-3 rounded-xl text-emerald-400">
                                    <i class="fa-solid fa-utensils"></i>
                                </div>
                                <div>
                                    <h4 class="font-bold text-white text-sm">${item.nome}</h4>
                                    <p class="text-xs text-slate-400">${item.quantidade}x • R$ ${Number(item.preco_unitario).toFixed(2).replace('.', ',')} un • <span class="text-slate-500">${dataFormatada}</span></p>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="font-bold text-emerald-400 text-sm">R$ ${valorTotalItem.toFixed(2).replace('.', ',')}</span>
                                <button onclick="deletarItem('${item.id}')" class="text-slate-500 hover:text-red-400 p-2 transition">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
            }
        }

        function aplicarFiltroMes() {
            mesSelecionado = parseInt(document.getElementById('select-mes').value);
            anoSelecionado = parseInt(document.getElementById('select-ano').value);
            toggleFiltroMes();
            carregarDados();
        }

        function limparFiltroMes() {
            const hoje = new Date();
            mesSelecionado = hoje.getMonth();
            anoSelecionado = hoje.getFullYear();
            document.getElementById('select-mes').value = mesSelecionado;
            document.getElementById('select-ano').value = anoSelecionado;
            toggleFiltroMes();
            carregarDados();
        }

        function abrirModalProduto() {
            document.getElementById('modal-produto').classList.remove('hidden');
        }

        function fecharModalProduto() {
            document.getElementById('modal-produto').classList.add('hidden');
            document.getElementById('form-produto').reset();
        }

        async function salvarProduto(event) {
            event.preventDefault();
            const nome = document.getElementById('nome').value;
            const categoria = document.getElementById('categoria').value;
            const quantidade = document.getElementById('quantidade').value;
            const preco_unitario = document.getElementById('preco_unitario').value;

            try {
                const response = await fetch('/api/itens', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, categoria, quantidade, preco_unitario })
                });

                if (response.ok) {
                    fecharModalProduto();
                    carregarDados();
                } else {
                    alert('Erro ao salvar produto.');
                }
            } catch (err) {
                console.error("Erro:", err);
            }
        }

        async function deletarItem(id) {
            if (!confirm('Deseja realmente apagar este item?')) return;
            try {
                const response = await fetch(`/api/itens/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    carregarDados();
                } else {
                    alert('Erro ao deletar item.');
                }
            } catch (err) {
                console.error("Erro:", err);
            }
        }

        carregarDados();
    </script>
</body>
</html>
